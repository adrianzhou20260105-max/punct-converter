<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="把英文标点转换为中文标点，整理段落缩进、连接线和数字千分位。">
  <title>中文标点转换器</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f4f6f8;
      --paper: #fff;
      --ink: #242b35;
      --muted: #5e6978;
      --line: #dfe5ec;
      --soft: #f4f7fa;
      --blue: #dfeaf6;
      --blue-hover: #d2e2f2;
      --blue-border: #bfd2e6;
      --blue-ink: #2b4866;
      --focus: #436c9b;
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .55; }
    button:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .shell {
      width: min(1120px, 100% - 64px);
      margin-inline: auto;
      padding-block: 44px 36px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 27px;
      font-weight: 650;
      letter-spacing: -.025em;
      line-height: 1.35;
    }
    .editor {
      display: grid;
      grid-template-areas: "input output" "toolbar toolbar";
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      box-shadow: 0 2px 7px rgb(41 58 77 / 4%);
    }
    .panel {
      display: flex;
      min-width: 0;
      flex-direction: column;
    }
    .input-panel { grid-area: input; }
    .output-panel { grid-area: output; box-shadow: inset 1px 0 var(--line); }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 56px;
      padding: 4px 18px;
      border-bottom: 1px solid var(--line);
    }
    .panel-head label { font-size: 14px; font-weight: 650; }
    .button {
      min-height: 40px;
      padding: 7px 15px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
    }
    .button:hover:not(:disabled) { background: var(--soft); }
    .button.compact {
      min-height: 44px;
      padding: 4px 9px;
      border-color: transparent;
      color: var(--blue-ink);
    }
    .button.primary {
      padding-inline: 18px;
      border-color: var(--blue-border);
      background: var(--blue);
      color: var(--blue-ink);
    }
    .button.primary:hover:not(:disabled) { background: var(--blue-hover); }
    .text-area {
      display: block;
      width: calc(100% - 16px);
      height: clamp(260px, 44vh, 460px);
      margin: 8px 8px 0;
      padding: 10px;
      resize: vertical;
      border: 0;
      border-radius: 4px;
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .text-area::placeholder { color: var(--muted); opacity: 1; }
    .panel-foot {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 36px;
      margin-top: auto;
      padding-inline: 18px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .toolbar {
      grid-area: toolbar;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
      padding: 12px 18px;
      border-top: 1px solid var(--line);
    }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .shortcut { margin-inline-start: 6px; color: var(--muted); font-size: 12px; }
    .shortcut kbd { font: inherit; }
    .status { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .status[data-error] { color: #9c332e; }
    .mapping { margin-top: 14px; color: var(--muted); font-size: 13px; }
    .mapping summary {
      display: flex;
      align-items: center;
      gap: 9px;
      width: fit-content;
      min-height: 38px;
      padding-inline: 7px;
      border-radius: 4px;
      list-style: none;
      cursor: pointer;
      font-weight: 600;
    }
    .mapping summary:hover { color: var(--blue-ink); }
    .mapping summary::-webkit-details-marker { display: none; }
    .mapping summary::before {
      content: "";
      width: 6px;
      height: 6px;
      border-inline-end: 1px solid currentColor;
      border-block-end: 1px solid currentColor;
      transform: translateY(-2px) rotate(45deg);
    }
    .mapping[open] summary::before { transform: translateY(2px) rotate(225deg); }
    .map-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 7px;
      margin-top: 8px;
    }
    .map-grid span {
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--paper);
      text-align: center;
    }
    .map-grid [data-error] { grid-column: 1 / -1; }
    @media (max-width: 720px) {
      .shell { width: calc(100% - 24px); padding-top: 20px; }
      h1 { margin-bottom: 14px; font-size: 23px; }
      .editor {
        grid-template-areas: "input" "toolbar" "output";
        grid-template-columns: minmax(0, 1fr);
      }
      .output-panel { box-shadow: inset 0 1px var(--line); }
      .panel-head { min-height: 48px; padding-block: 1px; }
      .panel-head, .panel-foot, .toolbar { padding-inline: 12px; }
      .button { min-height: 44px; }
      .text-area {
        height: 150px;
        height: clamp(110px, 21svh, 195px);
        padding: 6px 4px;
      }
      .panel-foot { min-height: 30px; }
      .toolbar { padding-block: 8px; }
      .mapping { margin-top: 10px; }
    }
    @media (hover: none), (max-width: 375px) {
      .shortcut { display: none; }
    }
  </style>
</head>
<body data-engine="{{ engine }}">
  <main class="shell">
    <h1>标点转换器</h1>
    <section class="editor" aria-label="标点转换">
      <div class="panel input-panel">
        <div class="panel-head">
          <label for="input-text">原文</label>
          <button class="button compact" id="btn-example" type="button">填入示例</button>
        </div>
        <textarea class="text-area" id="input-text" maxlength="100000" spellcheck="false"
                  placeholder="粘贴或输入要转换的文字…"></textarea>
        <div class="panel-foot" id="input-count">0 字符</div>
      </div>
      <div class="toolbar">
        <div class="actions">
          <button class="button primary" id="btn-convert" type="button" disabled>转换标点</button>
          <button class="button" id="btn-clear" type="button">清空</button>
          <span class="shortcut"><kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>Enter</kbd></span>
        </div>
        <p class="status" id="status" role="status"></p>
      </div>
      <div class="panel output-panel">
        <div class="panel-head">
          <label for="output-text">转换结果</label>
          <button class="button compact" id="btn-copy" type="button" disabled>复制结果</button>
        </div>
        <textarea class="text-area" id="output-text" readonly
                  placeholder="转换结果会显示在这里"></textarea>
        <div class="panel-foot" id="output-count">0 字符</div>
      </div>
    </section>
    <details class="mapping" id="mapping">
      <summary>标点对照表</summary>
      <div class="map-grid" id="map-grid"></div>
    </details>
  </main>
  <script>
    const input = document.getElementById('input-text');
    const output = document.getElementById('output-text');
    const convert = document.getElementById('btn-convert');
    const copy = document.getElementById('btn-copy');
    const status = document.getElementById('status');
    const mapping = document.getElementById('mapping');
    const mapGrid = document.getElementById('map-grid');
    const inputCount = document.getElementById('input-count');
    const outputCount = document.getElementById('output-count');
    const serverMode = document.body.dataset.engine === 'flask';
    const numberFormat = new Intl.NumberFormat('zh-CN');
    let ready = false;

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.toggleAttribute('data-error', isError);
    }

    function updateCounts() {
      inputCount.textContent = `${numberFormat.format(input.value.length)} / ${numberFormat.format(input.maxLength)} 字符`;
      outputCount.textContent = `${numberFormat.format(output.value.length)} 字符`;
    }

    function clearResult() {
      output.value = '';
      copy.disabled = true;
      updateCounts();
    }

    async function fetchJson(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || '请求失败，请重试。');
      return data;
    }

    async function loadEngine() {
      if (serverMode) {
        return {
          process: (text) => fetchJson('convert', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text }),
          }),
          map: () => fetchJson('map'),
        };
      }

      const pyodideUrl = 'https://cdn.jsdelivr.net/pyodide/v0.29.4/full/';
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = pyodideUrl + 'pyodide.js';
        script.onload = resolve;
        script.onerror = () => reject(new Error('无法加载 Pyodide'));
        document.head.appendChild(script);
      });
      const [pyodide, response] = await Promise.all([
        loadPyodide({ indexURL: pyodideUrl }),
        fetch('utils.py', { cache: 'no-cache' }),
      ]);
      if (!response.ok) throw new Error('无法加载转换规则');
      pyodide.FS.writeFile('utils.py', await response.text());
      const module = pyodide.pyimport('utils');
      input.maxLength = module.MAX_TEXT_LENGTH;
      function unwrap(proxy) {
        try {
          return proxy.toJs({ dict_converter: Object.fromEntries });
        } finally {
          proxy.destroy();
        }
      }
      return {
        process: (text) => unwrap(module.process_text(text)),
        map: () => unwrap(module.get_punct_map()),
      };
    }

    updateCounts();
    setStatus('正在加载转换引擎…');
    const engine = loadEngine().then((backend) => {
      ready = true;
      convert.disabled = false;
      updateCounts();
      setStatus('');
      return backend;
    }).catch(() => {
      setStatus('转换引擎加载失败，请刷新页面重试。', true);
      return null;
    });

    input.addEventListener('input', () => {
      updateCounts();
      if (ready) setStatus('');
    });

    document.getElementById('btn-example').addEventListener('click', () => {
      input.value = [
        '据 Fortune Business Insights 报道, 2026——2034 年将持续见证产业变革.',
        '项目将贯通"数据--算力--模型--中试--应用", 预算为 1,234,567.89 元.',
      ].join('\n\n');
      clearResult();
      if (ready) setStatus('');
      input.focus();
    });

    convert.addEventListener('click', async () => {
      const text = input.value;
      if (!text.trim()) {
        setStatus('请先输入文字。', true);
        input.focus();
        return;
      }

      convert.disabled = true;
      setStatus('正在转换…');
      try {
        const backend = await engine;
        const data = await backend.process(text);
        if (text !== input.value) return;

        output.value = data.result;
        copy.disabled = !data.result.trim();
        updateCounts();
        const fixed = data.quote_issues.filter((issue) => issue.severity === 'FIXED').length;
        setStatus(fixed ? `已转换，修复引号 ${fixed} 处。` : '已转换。');
      } catch (error) {
        setStatus(error.message || '转换失败，请重试。', true);
      } finally {
        convert.disabled = !ready;
      }
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      input.value = '';
      clearResult();
      if (ready) setStatus('');
      input.focus();
    });

    copy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(output.value);
        setStatus('已复制结果。');
      } catch {
        output.select();
        if (document.execCommand('copy')) {
          setStatus('已复制结果。');
        } else {
          setStatus('已选中结果，请手动复制。');
        }
      }
    });

    input.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter' && !event.isComposing) {
        event.preventDefault();
        convert.click();
      }
    });

    mapping.addEventListener('toggle', async () => {
      if (!mapping.open || mapGrid.childElementCount) return;
      try {
        const backend = await engine;
        if (!backend) throw new Error();
        const pairs = [['" "', '“ ”'], ...Object.entries(await backend.map())];
        const entries = pairs.map(([from, to]) => {
          const entry = document.createElement('span');
          entry.textContent = `${from} → ${to}`;
          return entry;
        });
        mapGrid.replaceChildren(...entries);
      } catch {
        const message = document.createElement('span');
        message.dataset.error = '';
        message.textContent = '对照表加载失败，请刷新页面重试。';
        mapGrid.replaceChildren(message);
      }
    });
  </script>
</body>
</html>
