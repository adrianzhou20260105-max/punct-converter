<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="把英文标点转换为中文标点，并清理标记和数字千分位。">
  <title>中文标点转换器</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f6fb;
      --white: #fff;
      --ink: #192642;
      --muted: #52617a;
      --line: #dce3ef;
      --blue: #234dd7;
      --blue-dark: #1d3eaf;
      --tint: #edf2ff;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .55; }
    button:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid #5472e8;
      outline-offset: 3px;
    }
    .shell { width: min(1120px, 100% - 48px); margin-inline: auto; }
    .site-header { background: var(--white); border-bottom: 1px solid var(--line); }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 64px;
      font-size: 15px;
      font-weight: 700;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--blue);
      color: white;
      font-size: 20px;
      line-height: 1;
    }
    main { padding-block: 47px 40px; }
    .intro { margin-bottom: 28px; }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 4.6vw, 52px);
      line-height: 1.16;
      letter-spacing: -.04em;
    }
    .intro p { margin: 0; color: var(--muted); line-height: 1.7; }
    .editor {
      display: grid;
      grid-template-areas: "input output" "toolbar toolbar";
      grid-template-columns: repeat(2, minmax(0, 1fr));
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--white);
      box-shadow: 0 16px 40px -32px #233f71;
    }
    .panel { display: flex; min-width: 0; flex-direction: column; }
    .input-panel { grid-area: input; }
    .output-panel { grid-area: output; border-left: 1px solid var(--line); background: #fafbfe; }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 67px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--line);
    }
    .panel-head label { font-size: 16px; font-weight: 700; }
    .button {
      min-height: 40px;
      padding: 8px 15px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--white);
      color: var(--ink);
      font-size: 14px;
      font-weight: 650;
    }
    .button:hover:not(:disabled) { border-color: #a3b5ee; background: var(--tint); }
    .button.compact { min-height: 36px; padding: 6px 12px; }
    .button.primary { padding-inline: 22px; background: var(--blue); border-color: var(--blue); color: white; }
    .button.primary:hover:not(:disabled) { background: var(--blue-dark); border-color: var(--blue-dark); }
    .text-area {
      display: block;
      width: calc(100% - 16px);
      height: clamp(240px, 42vh, 450px);
      margin: 8px;
      padding: 14px 16px;
      resize: vertical;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.75;
    }
    .text-area::placeholder { color: #63718a; opacity: 1; }
    .panel-foot {
      display: flex;
      align-items: center;
      min-height: 40px;
      margin-top: auto;
      padding-inline: 24px;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .toolbar {
      grid-area: toolbar;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px 22px;
      padding: 15px 24px;
      border-top: 1px solid var(--line);
    }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .shortcut { margin-left: 4px; color: var(--muted); font-size: 12px; }
    .status { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .status[data-error] { color: #9e2722; }
    .mapping {
      margin-top: 17px;
      padding: 15px 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--white);
      font-size: 14px;
    }
    .mapping summary { width: fit-content; cursor: pointer; font-weight: 650; }
    .map-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
      gap: 8px;
      margin-top: 14px;
    }
    .map-grid span { padding: 7px; border-radius: 6px; background: var(--tint); text-align: center; }
    .map-grid [data-error] { grid-column: 1 / -1; }
    @media (max-width: 720px) {
      .shell { width: calc(100% - 28px); }
      main { padding-top: 28px; }
      .editor { grid-template-areas: "input" "toolbar" "output"; grid-template-columns: minmax(0, 1fr); }
      .output-panel { border-left: 0; border-top: 1px solid var(--line); }
      .panel-head, .panel-foot, .toolbar { padding-inline: 16px; }
      .panel-head { min-height: 56px; }
      .text-area { height: 190px; padding: 8px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body data-engine="{{ engine }}">
  <header class="site-header">
    <div class="shell brand"><span class="brand-mark" aria-hidden="true">“”</span>中文标点转换器</div>
  </header>
  <main class="shell">
    <div class="intro">
      <h1>英文标点转中文</h1>
      <p>转换引号和常用标点，自动去除井号、可见空格标记和数字千分位。</p>
    </div>
    <section class="editor" aria-label="标点转换">
      <div class="panel input-panel">
        <div class="panel-head">
          <label for="input-text">原文</label>
          <button class="button compact" id="btn-example" type="button">填入示例</button>
        </div>
        <textarea class="text-area" id="input-text" maxlength="100000" spellcheck="false"
                  placeholder="粘贴或输入要转换的文字…"></textarea>
        <div class="panel-foot" id="input-count">0 字符</div>
      </div>
      <div class="toolbar">
        <div class="actions">
          <button class="button primary" id="btn-convert" type="button" disabled>转换标点</button>
          <button class="button" id="btn-clear" type="button">清空</button>
          <span class="shortcut">Ctrl / ⌘ + Enter</span>
        </div>
        <p class="status" id="status" role="status"></p>
      </div>
      <div class="panel output-panel">
        <div class="panel-head">
          <label for="output-text">转换结果</label>
          <button class="button compact" id="btn-copy" type="button" disabled>复制结果</button>
        </div>
        <textarea class="text-area" id="output-text" readonly
                  placeholder="转换结果会显示在这里"></textarea>
        <div class="panel-foot" id="output-count">0 字符</div>
      </div>
    </section>
    <details class="mapping" id="mapping">
      <summary>标点对照表</summary>
      <div class="map-grid" id="map-grid"></div>
    </details>
  </main>
  <script>
    const input = document.getElementById('input-text');
    const output = document.getElementById('output-text');
    const convert = document.getElementById('btn-convert');
    const copy = document.getElementById('btn-copy');
    const status = document.getElementById('status');
    const mapping = document.getElementById('mapping');
    const mapGrid = document.getElementById('map-grid');
    const inputCount = document.getElementById('input-count');
    const outputCount = document.getElementById('output-count');
    const serverMode = document.body.dataset.engine === 'flask';
    const numberFormat = new Intl.NumberFormat('zh-CN');
    let ready = false;

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.toggleAttribute('data-error', isError);
    }

    function updateCounts() {
      inputCount.textContent = `${numberFormat.format(input.value.length)} / ${numberFormat.format(input.maxLength)} 字符`;
      outputCount.textContent = `${numberFormat.format(output.value.length)} 字符`;
    }

    function clearResult() {
      output.value = '';
      copy.disabled = true;
      updateCounts();
    }

    async function fetchJson(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || '请求失败，请重试。');
      return data;
    }

    async function loadEngine() {
      if (serverMode) {
        return {
          process: (text) => fetchJson('convert', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text }),
          }),
          map: () => fetchJson('map'),
        };
      }

      const pyodideUrl = 'https://cdn.jsdelivr.net/pyodide/v0.29.4/full/';
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = pyodideUrl + 'pyodide.js';
        script.onload = resolve;
        script.onerror = () => reject(new Error('无法加载 Pyodide'));
        document.head.appendChild(script);
      });
      const [pyodide, response] = await Promise.all([
        loadPyodide({ indexURL: pyodideUrl }),
        fetch('utils.py', { cache: 'no-cache' }),
      ]);
      if (!response.ok) throw new Error('无法加载转换规则');
      pyodide.FS.writeFile('utils.py', await response.text());
      const module = pyodide.pyimport('utils');
      input.maxLength = module.MAX_TEXT_LENGTH;
      function unwrap(proxy) {
        try {
          return proxy.toJs({ dict_converter: Object.fromEntries });
        } finally {
          proxy.destroy();
        }
      }
      return {
        process: (text) => unwrap(module.process_text(text)),
        map: () => unwrap(module.get_punct_map()),
      };
    }

    updateCounts();
    setStatus('正在加载转换引擎…');
    const engine = loadEngine().then((backend) => {
      ready = true;
      convert.disabled = false;
      updateCounts();
      setStatus('');
      return backend;
    }).catch(() => {
      setStatus('转换引擎加载失败，请刷新页面重试。', true);
      return null;
    });

    input.addEventListener('input', () => {
      updateCounts();
      if (ready) setStatus('');
    });

    document.getElementById('btn-example').addEventListener('click', () => {
      input.value = '## 收支小结\n　他说:"本月收入 1,234,567.89 元, 支出 12,500 元。"\n＃备注□请核对 ＂已确认＂ 的金额.';
      clearResult();
      if (ready) setStatus('');
      input.focus();
    });

    convert.addEventListener('click', async () => {
      const text = input.value;
      if (!text.trim()) {
        setStatus('请先输入文字。', true);
        input.focus();
        return;
      }

      convert.disabled = true;
      setStatus('正在转换…');
      try {
        const backend = await engine;
        const data = await backend.process(text);
        if (text !== input.value) return;

        output.value = data.result;
        copy.disabled = !data.result.trim();
        updateCounts();
        const fixed = data.quote_issues.filter((issue) => issue.severity === 'FIXED').length;
        setStatus(fixed ? `已转换，修复引号 ${fixed} 处。` : '已转换。');
      } catch (error) {
        setStatus(error.message || '转换失败，请重试。', true);
      } finally {
        convert.disabled = !ready;
      }
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      input.value = '';
      clearResult();
      if (ready) setStatus('');
      input.focus();
    });

    copy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(output.value);
        setStatus('已复制结果。');
      } catch {
        output.select();
        if (document.execCommand('copy')) {
          setStatus('已复制结果。');
        } else {
          setStatus('已选中结果，请手动复制。');
        }
      }
    });

    input.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter' && !event.isComposing) {
        event.preventDefault();
        convert.click();
      }
    });

    mapping.addEventListener('toggle', async () => {
      if (!mapping.open || mapGrid.childElementCount) return;
      try {
        const backend = await engine;
        if (!backend) throw new Error();
        const pairs = [['" "', '“ ”'], ...Object.entries(await backend.map())];
        const entries = pairs.map(([from, to]) => {
          const entry = document.createElement('span');
          entry.textContent = `${from} → ${to}`;
          return entry;
        });
        mapGrid.replaceChildren(...entries);
      } catch {
        const message = document.createElement('span');
        message.dataset.error = '';
        message.textContent = '对照表加载失败，请刷新页面重试。';
        mapGrid.replaceChildren(message);
      }
    });
  </script>
</body>
</html>
